<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>120 FPS HTML Game</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
        }
        canvas {
            background-color: #222;
            border: 2px solid #555;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }
        #info { margin-top: 10px; color: #888; }
    </style>
</head>
<body>

    <h1>120Hz Ping Pong</h1>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="info">Use your <b>Mouse</b> to move the paddle. Keep the ball alive!</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game objects
        const paddle = {
            width: 15,
            height: 100,
            x: 20,
            y: 150,
            speed: 500
        };

        const ball = {
            x: 400,
            y: 200,
            radius: 10,
            dx: 400,
            dy: 300
        };

        let lastTime = 0;
        let score = 0;

        // Track mouse movement
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            paddle.y = e.clientY - rect.top - (paddle.height / 2);
        });

        function update(deltaTime) {
            // Ball physics (multiplied by deltaTime for 120fps smoothness)
            ball.x += ball.dx * deltaTime;
            ball.y += ball.dy * deltaTime;

            // Wall collisions (top/bottom)
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.dy = -ball.dy;
            }

            // Paddle collision
            if (ball.x - ball.radius < paddle.x + paddle.width &&
                ball.x + ball.radius > paddle.x &&
                ball.y > paddle.y &&
                ball.y < paddle.y + paddle.height) {
                
                ball.dx = -ball.dx * 1.05; // Increase speed slightly
                score++;
            }

            // Wall collision (right)
            if (ball.x + ball.radius > canvas.width) {
                ball.dx = -ball.dx;
            }

            // Game over (ball passes left)
            if (ball.x - ball.radius < 0) {
                alert(`Game Over! Score: ${score}`);
                resetGame();
            }
        }

        function resetGame() {
            ball.x = 400;
            ball.y = 200;
            ball.dx = 400;
            ball.dy = 300;
            score = 0;
        }

        function draw() {
            // Clear screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw paddle
            ctx.fillStyle = '#fff';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

            // Draw ball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // Draw score
            ctx.font = '20px monospace';
            ctx.fillText(`Score: ${score}`, 20, 30);
        }

        function loop(timestamp) {
            // Calculate delta time in seconds
            let deltaTime = (timestamp - lastTime) / 1000;
            if (deltaTime > 0.1) deltaTime = 0.1; // Cap at 100ms lag spikes
            lastTime = timestamp;

            update(deltaTime);
            draw();

            // Request next frame at maximum monitor refresh rate (e.g., 120Hz)
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
